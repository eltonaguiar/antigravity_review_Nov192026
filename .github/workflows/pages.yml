name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      # PROVEIT lives at the repo root because README.md and the live
      # /PROVEIT_KILOCODE.html link to it on github.com. It is staged into the
      # published tree at build time (see below). Without this trigger a change
      # to the deliverable would never redeploy the site.
      - 'PROVEIT/**'
      - 'ZOOCODE/**'
      - 'harvest/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify site assets exist
        run: |
          test -f docs/index.html || { echo "docs/index.html missing"; exit 1; }
          echo "index.html bytes: $(wc -c < docs/index.html)"
          grep -q 'id="toc"' docs/index.html || { echo "TOC anchor missing"; exit 1; }
          echo "asset checks passed"

      # Stage the deliverable into the published tree at BUILD TIME.
      # Root PROVEIT/ is the single source of truth. Do NOT commit a second copy
      # under docs/PROVEIT/ - two unsynchronised copies is the divergence pattern
      # that cost us commit 8277657 (a silent revert).
      - name: Stage PROVEIT deliverable into the Pages tree
        run: |
          test -d PROVEIT || { echo "PROVEIT/ missing from repo root"; exit 1; }
          mkdir -p docs/PROVEIT
          rsync -a --exclude '.git*' PROVEIT/ docs/PROVEIT/
          echo "staged $(find docs/PROVEIT -type f | wc -l) files from PROVEIT/"
          test -f docs/PROVEIT/index.html || { echo "landing page docs/PROVEIT/index.html missing"; exit 1; }

      # HARVEST run reports live at ZOOCODE/COPILOT<DATETIME>.MD in the repo root.
      # Same publish-path issue as PROVEIT: root is not published, docs/ is. Stage it.
      - name: Stage ZOOCODE run reports into the Pages tree
        run: |
          if [ -d ZOOCODE ]; then
            mkdir -p docs/ZOOCODE
            rsync -a --exclude '.git*' ZOOCODE/ docs/ZOOCODE/
            echo "staged $(find docs/ZOOCODE -type f | wc -l) file(s) from ZOOCODE/"
          else
            echo "ZOOCODE/ absent - skipping (harvester has not run yet)"
          fi

      # The HARVEST page fetches data/harvest_signals.json. If the feed is missing
      # the page renders an explicit error rather than stale numbers, but a missing
      # feed at build time usually means the harvester failed - surface it here.
      - name: Check HARVEST data feed
        run: |
          if [ -f docs/harvest.html ]; then
            test -f docs/data/harvest_signals.json || { echo "docs/HARVEST.html present but docs/data/harvest_signals.json missing"; exit 1; }
            echo "harvest feed bytes: $(wc -c < docs/data/harvest_signals.json)"
          else
            echo "harvest.html absent - skipping"
          fi

      # Gate: every relative href in the landing page must resolve inside the
      # published tree. This is the check that would have caught the original
      # defect, where the page advertised files the site never served.
      - name: Verify landing-page link integrity
        run: |
          missing=0
          while read -r h; do
            [ -f "docs/PROVEIT/$h" ] && continue
            echo "MISSING TARGET: $h"
            missing=$((missing + 1))
          done < <(grep -oE 'href="[^"]+"' docs/PROVEIT/index.html \
                     | sed 's/href="//; s/"$//' \
                     | grep -vE '^(https?:|mailto:|#|/|\?)' \
                     | sort -u)
          if [ "$missing" -ne 0 ]; then
            echo "$missing broken relative link(s) in docs/PROVEIT/index.html"
            exit 1
          fi
          echo "link integrity: OK"

      - name: Render harvest rule legend from constants
        run: python3 42_HARVEST_UPGRADE_2026-11-24/kilocode/render_legend.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
